[project]
name = "tavi-runtime"
version = "0.1.0"
description = "Local event-driven runtime for Tavi"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
audio = [
    "numpy==2.4.2",
    "onnxruntime==1.24.2",
]
wake = [
    "sentencepiece==0.2.1",
    "sherpa-onnx==2.0.1",
]
wake-training = [
    "scikit-learn==1.9.1",
]
local-asr = [
    "faster-whisper==1.2.1",
]
conversation = [
    "openai==2.54.0",
]
memory-pilot = [
    "websockets==17.4",
    "tiktoken==0.14.0",
]
speaker-id = [
    "numpy==2.4.2",
    "onnxruntime==1.24.2",
    "sherpa-onnx==2.0.1",
]
local-tts = [
    "piper-tts==1.8.0",
]

[tool.uv]
package = false
