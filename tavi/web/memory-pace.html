<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paprika · response pace</title>
<style>
:root{font-family:system-ui,sans-serif;color:#203131;background:#f4f1e9}body{margin:0}main{max-width:850px;margin:auto;padding:30px 22px 70px}h1{font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.15}h2{font-size:1.35rem}.muted{color:#526463;line-height:1.6}.card{background:#fff;border:1px solid #dce3db;border-radius:20px;padding:24px;margin:20px 0}.question{font-size:1.55rem;line-height:1.4;font-weight:650;border-left:4px solid #d16e3a;padding-left:18px}button{font:inherit;padding:14px 20px;border:0;border-radius:12px;background:#235d51;color:white;cursor:pointer;margin:6px 8px 6px 0;font-weight:650}button.secondary{background:#e4ebe5;color:#234139}button:disabled{opacity:.45;cursor:default}label{display:block;margin:14px 0;line-height:1.5}input[type=radio]{margin-right:10px}textarea{box-sizing:border-box;width:100%;min-height:105px;border:1px solid #a5b5ad;border-radius:10px;font:inherit;padding:14px}.status{position:sticky;top:0;background:#fff8e8;border:1px solid #e3ce9d;padding:17px;border-radius:12px;z-index:2;font-size:1.1rem;font-weight:650}.status.talking{background:#dff2e6;border-color:#72a88a}.status.thinking::before{content:'● ';color:#bf6c22;animation:pulse 1s infinite}.status.talking::before{content:'♫ ';color:#267455}.error{color:#8a2632;font-weight:600}details{margin:20px 0;color:#526463}summary{cursor:pointer}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}output{font-weight:700}@keyframes pulse{50%{opacity:.25}}[hidden]{display:none!important}
